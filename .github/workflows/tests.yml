name: resolvedesk-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - run: uv python install 3.12
      - run: python scripts/unpack_evidence.py
      - run: uv sync --frozen --python 3.12 --group viz
      - run: uv run ruff check resolve_desk training tests scripts --exclude "*.ipynb"
      - run: uv run pytest -q
      - run: node --check --input-type=module < resolve_desk/static/app.js
