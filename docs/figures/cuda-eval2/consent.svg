  <g id="text_31">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #253744" transform="translate(7.2 411.367203)">Original-exchange cohort only. Proposals/commits require an actual matching scoped YES; final returned orders require a verified commit.</text>
